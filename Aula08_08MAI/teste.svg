<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="40" fill="#238636">
    <animate 
      attributeName="r" 
      values="40;48;40" 
      dur="2s" 
      repeatCount="indefinite" />
    <animate 
      attributeName="opacity" 
      values="1;0.5;1" 
      dur="2s" 
      repeatCount="indefinite" />
  </circle>
</svg>